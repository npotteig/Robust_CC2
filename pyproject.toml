[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyborg"
version = "0.1.0"
description = "Inductive learning models for cybersecurity graph neural networks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "anonymous", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric==2.7.0",
    "networkx>=2.6.0",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "joblib>=1.5.3",
    "scipy>=1.16.3",
    "scikit-learn>=1.8.0",
    "lightning>=2.6.0",
    "matplotlib>=3.10.8",
    "wandb>=0.23.1",
    "paramiko>=4.0.0",
    "gym>=0.26.2",
    "prettytable>=3.17.0",
    "pygame>=2.6.1",
    "dm-tree>=0.1.9",
    "py-trees>=2.4.0",
    "gymnasium>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["CybORG*"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["inductive_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=inductive_learning --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch_geometric.*",
    "networkx.*",
]
ignore_missing_imports = true
